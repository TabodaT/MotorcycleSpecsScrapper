# Motorcycle Market Intelligence — two services only: app + db.
# Runs first-try with no .env (inline defaults below). Copy .env.example to .env to override.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-motointel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-motointel_local_dev}
      POSTGRES_DB: ${DB_NAME:-motointel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_NAME: ${DB_NAME:-motointel}
      DB_USER: ${DB_USER:-motointel}
      DB_PASSWORD: ${DB_PASSWORD:-motointel_local_dev}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/storage}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-MotoIntelBot/1.0 (+local)}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-15000}
      CATALOG_RATE_LIMIT_RPS: ${CATALOG_RATE_LIMIT_RPS:-1}
      CATALOG_MAX_MODELS_PER_RUN: ${CATALOG_MAX_MODELS_PER_RUN:-0}
      CATALOG_MAX_PAGES_PER_MANUFACTURER: ${CATALOG_MAX_PAGES_PER_MANUFACTURER:-50}
      LISTING_REMOVED_THRESHOLD_N: ${LISTING_REMOVED_THRESHOLD_N:-2}
      LISTING_LIKELY_SOLD_DAYS_X: ${LISTING_LIKELY_SOLD_DAYS_X:-7}
      SCHEDULER_DEFAULT_INTERVAL_CRON: ${SCHEDULER_DEFAULT_INTERVAL_CRON:-0 0 3 * * *}
    volumes:
      - storage:/data/storage
    ports:
      - "${APP_HOST_PORT:-18080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
  storage:
